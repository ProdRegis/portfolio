<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regis He Charcoal Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Regis He: finance and data science at NYU Stern. Web apps, product case studies, and prototypes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: 12-col editorial grid, asymmetric work rows (media 8 / text 4, alternating), hairline rules between sections, oversized expanded display type */
:root{
  --bg:#0b0b0c;          /* clean near-black */
  --bg-2:#131315;        /* raised surface */
  --fg:#f5f5f3;          /* crisp white */
  --muted:#8b8c91;       /* neutral secondary text */
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.22);
  --accent:#9fb4c7;      /* soft steel blue */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Geist","Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.24,1);
  --slow:900ms;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  --max:1440px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
::selection{background:var(--accent);color:var(--bg)}

.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (min-width:900px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.mono{font:500 11.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rule{border:0;border-top:1px solid var(--line);margin:0}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .6s var(--ease)}
.nav.lined{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{font:600 15px/1 var(--display);font-stretch:112%;letter-spacing:.01em}
.brand span{color:var(--muted);font-weight:400}
.nav ul{display:flex;gap:clamp(14px,3vw,36px);list-style:none;margin:0;padding:0}
.nav ul a{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .4s var(--ease)}
.nav ul a:hover,.nav ul a[aria-current="true"]{color:var(--fg)}
@media (max-width:520px){.brand span{display:none}}
@media (max-width:400px){.nav ul{gap:12px}.nav ul a{font-size:11px;letter-spacing:.04em}}

/* Hero */
.hero{padding-block:clamp(40px,7vw,96px) clamp(32px,5vw,64px)}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,27vw,380px);grid-template-areas:"eyebrow photo" "name photo" "role photo" "cta photo";column-gap:clamp(24px,5vw,80px);align-items:end}
.hero .eyebrow{grid-area:eyebrow;display:flex;flex-wrap:wrap;gap:8px 28px;align-self:start;margin-bottom:clamp(24px,4vw,48px)}
.hero .name{grid-area:name}
.name{font:600 clamp(3.6rem,10.4vw,10.2rem)/.84 var(--display);font-stretch:118%;letter-spacing:-.035em;margin:0;text-wrap:balance}
.name .ln{display:block;overflow:hidden;padding-bottom:.16em;margin-bottom:-.12em}
.name .ln>span{display:inline-block}
.name .dot{color:var(--accent);display:inline-block}
.role{grid-area:role;font:400 clamp(1.3rem,2.6vw,2.3rem)/1.14 var(--display);font-stretch:104%;letter-spacing:-.012em;margin:clamp(20px,2.6vw,36px) 0 clamp(24px,2.6vw,36px);max-width:22ch;text-wrap:balance}
.role em{font-style:normal;color:var(--accent)}
.hero .cta{grid-area:cta}
.hero-photo{grid-area:photo;align-self:stretch;margin:0;position:relative;min-height:100%;overflow:hidden;background:var(--bg-2);border-radius:4px;clip-path:inset(0 0 0 0 round 4px);transition:clip-path 1.3s var(--ease) .1s}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(.12) brightness(.97);transition:transform 1.8s var(--ease) .1s}
.hero-photo figcaption{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:space-between;color:rgba(255,255,255,.82);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero-photo::after{content:"";position:absolute;inset:0;border:1px solid var(--line);border-radius:4px;pointer-events:none}
html.intro-on .hero-photo{clip-path:inset(100% 0 0 0 round 4px)}
html.intro-on .hero-photo img{transform:scale(1.08)}
@media (max-width:700px){
  .hero-main{grid-template-columns:minmax(0,1fr) 36%;grid-template-areas:"eyebrow eyebrow" "name name" "role photo" "cta photo";column-gap:18px}
  .role{margin-bottom:18px}
  .hero-photo{min-height:170px}
  .hero-photo figcaption{display:none}
}
.cta{display:inline-flex;align-items:center;gap:12px;font:500 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:15px 20px;border:1px solid var(--line-strong);border-radius:999px;justify-self:start;transition:border-color .5s var(--ease),color .5s var(--ease)}
.cta i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.cta:hover{border-color:var(--accent);color:var(--accent)}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-top:18px;margin-top:clamp(40px,6vw,80px);border-top:1px solid var(--line)}

/* Section heads */
.sec{padding-block:clamp(64px,9vw,120px)}
.sec-head{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:clamp(40px,6vw,80px)}
.sec-head h2{grid-column:1/9;margin:0;font:500 clamp(2.4rem,6.4vw,6rem)/.92 var(--display);font-stretch:112%;letter-spacing:-.03em}
.sec-head .mono{grid-column:9/13;justify-self:end;text-align:right}
@media (max-width:700px){.sec-head h2,.sec-head .mono{grid-column:1/-1;justify-self:start;text-align:left}}

/* Reveal (added by JS only) */
.pre{opacity:0;transform:translateY(22px)}
.in{opacity:1;transform:none;transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}

/* Work */
.work{display:grid;gap:clamp(72px,11vw,160px)}
.proj{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;align-items:end;position:relative}
.proj .media{grid-column:1/9;grid-row:1}
.proj .info{grid-column:9/13;grid-row:1;padding-bottom:6px}
.proj.flip .media{grid-column:5/13}
.proj.flip .info{grid-column:1/5}
@media (max-width:860px){.proj .media,.proj.flip .media,.proj .info,.proj.flip .info{grid-column:1/-1;grid-row:auto}}
.media{position:relative;display:block;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--bg-2);border-radius:2px}
.media .shift{position:absolute;inset:-6% 0;will-change:transform}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease),filter 1.2s var(--ease),opacity 1s var(--ease)}
.media .a{filter:saturate(.7) brightness(.93)}
.media .b{opacity:0}
.media video.b{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease)}
.media.playing video.b{opacity:1}
.media .tag{position:absolute;left:14px;bottom:14px;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border-radius:999px;background:rgba(11,11,12,.72);color:var(--fg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .5s var(--ease)}
.media .tag svg{color:var(--accent)}
.media.playing .tag{opacity:0}
.media::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none}
.proj:hover .media .a,.proj:focus-within .media .a{transform:scale(1.035);filter:none}
.proj:hover .media .b,.proj:focus-within .media .b{opacity:1;transform:scale(1.035)}
.kicker{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.kicker b{width:22px;height:1px;background:var(--accent);display:block}
.proj h3{margin:0 0 14px;font:500 clamp(2rem,3.6vw,3.4rem)/.98 var(--display);font-stretch:110%;letter-spacing:-.025em;transition:transform .9s var(--ease),color .7s var(--ease)}
.proj:hover h3,.proj:focus-within h3{transform:translateX(8px);color:var(--accent)}
.proj p{margin:0 0 22px;color:var(--muted);max-width:40ch}
.proj .go{display:inline-flex;gap:10px;align-items:center;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--line-strong);transition:border-color .5s var(--ease)}
.proj .go:hover{border-color:var(--accent)}

/* Cursor label */
.cursor{position:fixed;left:0;top:0;z-index:70;pointer-events:none;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:9px 12px;border-radius:999px;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.cursor.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* More projects */
.more{margin-top:clamp(72px,10vw,140px)}
.more-h{margin:0 0 18px}
.rows.more-rows li{grid-template-columns:minmax(0,.9fr) minmax(0,2fr) 110px}
.more-rows .what{max-width:70ch}
@media (max-width:560px){.rows.more-rows li{grid-template-columns:1fr auto}}
/* Experience */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 140px;gap:16px;padding:22px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rows li>*{min-width:0}
.rows .org{font:500 clamp(1.1rem,1.6vw,1.4rem)/1.2 var(--display);font-stretch:104%}
.rows .what{color:var(--muted)}
.rows .when{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.sec-head + .rows{border-top:0;margin-top:calc(-1 * clamp(40px,6vw,80px) + 8px)}
.tools{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 22px}
.tools span:first-child{color:var(--fg)}
@media (max-width:560px){.rows li{grid-template-columns:1fr auto}.rows .what{grid-column:1/-1;grid-row:2}}

/* Contact */
.big{font:500 clamp(2.6rem,8.4vw,8.2rem)/.9 var(--display);font-stretch:114%;letter-spacing:-.035em;margin:0 0 clamp(40px,6vw,72px);text-wrap:balance}
.big span{color:var(--muted)}
.clist{border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:160px 1fr auto;gap:16px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.crow>*{min-width:0}
.crow .val{font:400 clamp(1.1rem,2vw,1.6rem)/1.2 var(--display);font-stretch:104%;overflow-wrap:anywhere}
.crow .act{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0;transition:color .4s var(--ease)}
.crow .act:hover{color:var(--accent)}
a.crow .val{transition:transform .8s var(--ease),color .6s var(--ease)}
a.crow:hover .val{transform:translateX(8px);color:var(--accent)}
@media (max-width:600px){.crow{grid-template-columns:1fr auto}.crow .mono{grid-column:1/-1}}

footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}

/* Case study */
.case-top{padding-block:clamp(32px,5vw,64px) 0}
.back{display:inline-flex;gap:10px;align-items:center}
.back:hover{color:var(--fg)}
.case-title{font:600 clamp(3rem,10vw,10rem)/.86 var(--display);font-stretch:116%;letter-spacing:-.04em;margin:clamp(28px,4vw,48px) 0 clamp(20px,3vw,32px);text-wrap:balance}
.case-sub{font:400 clamp(1.2rem,2.2vw,1.9rem)/1.25 var(--display);font-stretch:104%;color:var(--muted);max-width:30ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:1px solid var(--line);margin-top:clamp(36px,5vw,64px)}
.facts div{padding:18px 24px 18px 0;border-bottom:1px solid var(--line)}
.facts dt{margin-bottom:8px}
.facts dd{margin:0}
.case-hero{margin-top:clamp(36px,5vw,64px)}
.case-hero .media{aspect-ratio:16/10}
.case-hero .media img,.case-hero .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.caption{margin-top:12px}
.split{display:grid;grid-template-columns:repeat(12,1fr);gap:24px;padding-block:clamp(56px,8vw,112px)}
.split>h2{grid-column:1/5;margin:0;font:500 clamp(1.6rem,2.6vw,2.4rem)/1 var(--display);font-stretch:110%;letter-spacing:-.02em}
.split>.body{grid-column:6/13;min-width:0}
@media (max-width:860px){.split>h2,.split>.body{grid-column:1/-1}}
.points{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.points li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.points li>*{min-width:0}
.points li .mono{padding-top:5px}
@media (max-width:560px){.points li{grid-template-columns:1fr;gap:6px}}
.intro-p{margin:0 0 28px;font-size:1.1rem;max-width:58ch}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:14px 18px;border:1px solid var(--line-strong);border-radius:999px;transition:border-color .5s var(--ease),color .5s var(--ease),background .5s var(--ease)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.pw{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--muted);padding:6px 0}
.pw code{color:var(--fg);font:inherit}
.pw button{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}

/* Deck */
.deck .media{aspect-ratio:16/9;background:#0e0e0d}
.deck .media img{object-fit:contain;filter:none}
.deck-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px}
.deck-bar .ctrls{display:flex;gap:8px}
.deck-bar button{width:46px;height:46px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;transition:border-color .4s var(--ease),color .4s var(--ease)}
.deck-bar button:hover{border-color:var(--accent);color:var(--accent)}
.deck-bar svg{width:16px;height:16px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:16px;padding-bottom:6px;scrollbar-width:thin}
.thumbs button{flex:0 0 112px;aspect-ratio:16/9;border:1px solid var(--line);opacity:.5;transition:opacity .5s var(--ease),border-color .5s var(--ease)}
.thumbs button[aria-current="true"],.thumbs button:hover{opacity:1;border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.screens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,3vw,40px);align-items:start}
.screens figure{margin:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--bg-2)}
.screens img{width:100%;height:auto}
.screens figure:nth-child(2){margin-top:clamp(24px,5vw,72px)}
.next{display:block;padding-block:clamp(56px,8vw,112px);border-top:1px solid var(--line)}
.next .case-title{margin:16px 0 0;font-size:clamp(2.6rem,8vw,7.5rem);transition:transform 1s var(--ease),color .8s var(--ease)}
.next:hover .case-title{transform:translateX(12px);color:var(--accent)}

/* Resume */
.pages{display:grid;gap:24px;justify-items:center}
.pages canvas{width:100%;max-width:880px;height:auto;background:#fff;border-radius:2px}
.pages .note{color:var(--muted)}

/* Film-cut veil */
.veil{position:fixed;inset:0;background:var(--bg);z-index:80;opacity:0;pointer-events:none;transition:opacity .32s var(--ease)}
.veil.on{opacity:1;pointer-events:auto}

/* Intro: a small character writes the name in cursive, then the page settles in */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);padding-left:var(--gut);padding-right:var(--gut-r);transition:opacity .7s var(--ease);animation:failsafe .01s linear 7s forwards;cursor:pointer}
.intro.out{opacity:0;pointer-events:none}
.intro .stage{width:min(820px,100%);position:relative}
.intro svg{width:100%;height:auto;overflow:visible;display:block}
.intro .ink{fill:none;stroke:var(--fg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.intro .skin{fill:var(--fg)}
.intro .shirt{fill:var(--accent)}
.intro .eye{fill:var(--bg)}
.intro .limb{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linecap:round}
.intro .pencil{stroke:var(--muted);stroke-width:2.8;stroke-linecap:round}
.intro .irole{display:flex;justify-content:space-between;gap:16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);opacity:0;transition:opacity .6s var(--ease)}
.intro.done .irole{opacity:1}
.intro .skip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 4px;color:var(--muted)}
.intro .skip:hover{color:var(--fg)}
@keyframes failsafe{to{opacity:0;visibility:hidden}}
.hero .name .ch{display:inline-block;transform-origin:0 100%;transition:transform .75s cubic-bezier(.3,1.5,.5,1)}
html.intro-on .hero .name .ch{transform:translateY(125%) rotate(10deg)}
html.intro-on .hero .enter{opacity:0;transform:translateY(14px)}
.hero .enter{transition:opacity .9s var(--ease),transform .9s var(--ease)}
.hero .enter.d1{transition-delay:.08s}.hero .enter.d2{transition-delay:.18s}.hero .enter.d3{transition-delay:.28s}.hero .enter.d4{transition-delay:.38s}
html.intro-on .nav{opacity:0}
.nav{transition:border-color .6s var(--ease),opacity .9s var(--ease) .2s}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *:not(.intro):not(.intro *),*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}
  .media .shift{transform:none!important}
}
</style>

</head>
<body>
<div class="intro" id="intro" aria-hidden="true">
  <div class="stage">
    <svg viewBox="-14 -40 376 180" id="introSvg">
      <g id="ink"></g>
      <g id="buddy" transform="translate(30 6)">
        <g id="bud">
          <line class="pencil" x1="0" y1="0" x2="6" y2="-8"/>
          <line class="limb" x1="6" y1="-8" x2="12" y2="3"/>
          <line class="limb" id="legL" x1="14" y1="15" x2="13" y2="25"/>
          <line class="limb" id="legR" x1="20" y1="15" x2="21" y2="25"/>
          <rect class="shirt" x="10" y="1" width="14" height="15" rx="5"/>
          <line class="limb" id="armO" x1="22" y1="4" x2="27" y2="11"/>
          <circle class="skin" cx="17" cy="-7" r="7.5"/>
          <g id="eyes"><circle class="eye" cx="15" cy="-7.5" r="1.05"/><circle class="eye" cx="19.6" cy="-7.5" r="1.05"/></g>
        </g>
      </g>
    </svg>
    <div class="irole mono"><span>Finance and data science</span><span>NYU Stern, New York</span></div>
  </div>
  <button class="skip mono" type="button" tabindex="-1">Skip</button>
</div>
<script>
(function(){var d=document.documentElement;d.classList.add("intro-on");
setTimeout(function(){d.classList.remove("intro-on");var i=document.getElementById("intro");if(i)i.remove();},7200);})();
</script>
<div class="veil" id="veil" aria-hidden="true"></div>
<div class="cursor" id="cursor" aria-hidden="true">View case</div>

<header class="nav" id="nav">

function scrollToHash(h) {
  const t = h && h.length > 1 ? document.getElementById(h.slice(1)) : null;
  if (t && h !== "#top") t.scrollIntoView({ behavior: "auto" }); else scrollTo(0, 0);
}
function go(h, first) {
  const r = routeOf(h);
  if (first) { render(r); if (r === "home") scrollToHash(h); return; }

/* ---------- Hover previews: play on hover, or when in view on touch screens ---------- */
let pio;
const mp4ok = (() => { try { return !!document.createElement("video").canPlayType('video/mp4; codecs="avc1.42E01E"'); } catch (_) { return true; } })();
const pickSrc = mp4 => mp4ok ? mp4 : mp4.replace(/\.mp4$/, ".webm");
function bindPreviews() {
  pio && pio.disconnect();
  const cards = [...document.querySelectorAll(".proj .media")];
  const start = m => {
    if (reduced) return;
    const v = m.querySelector("video.b"); if (!v) return;
    if (!v.src) v.src = pickSrc(v.dataset.src);
    v.currentTime = 0;
    const pr = v.play(); m.classList.add("playing");
    if (pr && pr.catch) pr.catch(() => m.classList.remove("playing"));
  };
  const stop = m => { const v = m.querySelector("video.b"); m.classList.remove("playing"); if (v) setTimeout(() => { if (!m.classList.contains("playing")) v.pause(); }, 600); };
  if (finePointer) {
    cards.forEach(m => {
      const card = m.closest(".proj");
      card.addEventListener("pointerenter", () => start(m));
      card.addEventListener("pointerleave", () => stop(m));
      card.addEventListener("focusin", () => start(m));
      card.addEventListener("focusout", () => stop(m));
    });
  } else if ("IntersectionObserver" in window && !reduced) {
    pio = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? start(e.target) : stop(e.target)), { threshold: 0.6 });
    cards.forEach(m => pio.observe(m));
  }
}

/* ---------- Reveal once ---------- */
let io;
function setupReveal() {
  if (reduced || !("IntersectionObserver" in window)) return;
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); e.target.classList.remove("pre"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -10% 0px" });
  document.querySelectorAll("[data-reveal]").forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight * 0.9) return;
    el.classList.add("pre"); io.observe(el);
  });
}

/* ---------- Restrained scroll drift ---------- */
let shifts = [], ticking = false;
function collectShift() { shifts = reduced ? [] : [...document.querySelectorAll(".media .shift")]; drift(); }
function drift() {
  ticking = false;
  const vh = innerHeight;
  for (const s of shifts) {
    const r = s.parentElement.getBoundingClientRect();
    if (r.bottom < -100 || r.top > vh + 100) continue;
    const p = (r.top + r.height / 2 - vh / 2) / vh; // -1..1
    s.style.transform = `translate3d(0,${(p * -22).toFixed(1)}px,0)`;
  }
}
addEventListener("scroll", () => {
  $("#nav").classList.toggle("lined", scrollY > 12);
  if (!ticking && shifts.length) { ticking = true; requestAnimationFrame(drift); }
}, { passive: true });
addEventListener("resize", drift);

/* ---------- Cursor label (fine pointers only) ---------- */
const cur = $("#cursor");
let cx = 0, cy = 0, tx = 0, ty = 0, raf = 0;
function loop() {
  cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
  cur.style.left = cx + "px"; cur.style.top = cy + "px";
  raf = Math.abs(tx - cx) + Math.abs(ty - cy) > 0.3 ? requestAnimationFrame(loop) : 0;
}
function bindCursor() {
  if (!finePointer) return;
  document.querySelectorAll("[data-cursor]").forEach(m => {
    m.addEventListener("pointerenter", e => { cx = tx = e.clientX; cy = ty = e.clientY; loop(); cur.classList.add("on"); });
    m.addEventListener("pointerleave", () => cur.classList.remove("on"));
    m.addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; if (reduced) { cx = tx; cy = ty; loop(); } else if (!raf) raf = requestAnimationFrame(loop); });
  });
}
cur.hidden = !finePointer;

function setSlide(n) {
  const p = PROJECTS.find(x => x.id === current); if (!p || !p.deck) return;

  if (reduced) swap(); else { img.style.transition = "opacity .25s"; img.style.opacity = 0; setTimeout(swap, 180); }
  $("#deckNum").textContent = `${String(deckIdx + 1).padStart(2, "0")} / ${String(p.deck.length).padStart(2, "0")}`;
  document.querySelectorAll("[data-slide]").forEach(b => b.setAttribute("aria-current", +b.dataset.slide === deckIdx ? "true" : "false"));
  const t = document.querySelector(`[data-slide="${deckIdx}"]`); t && t.scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduced ? "auto" : "smooth" });
  const pre = new Image(); pre.src = p.deck[(deckIdx + 1) % p.deck.length];
}

    try { navigator.clipboard.writeText(c.dataset.copy).then(done, fallback); } catch (_) { fallback(); }

function intro() {
  const el = document.getElementById("intro"), root = document.documentElement;
  if (!el) return;
  const NS = "http://www.w3.org/2000/svg";
  const ink = el.querySelector("#ink"), buddy = el.querySelector("#buddy"), bud = el.querySelector("#bud");
  const legL = el.querySelector("#legL"), legR = el.querySelector("#legR"), armO = el.querySelector("#armO"), eyes = el.querySelector("#eyes");

  const finish = () => {
    if (ended) return; ended = true; cancelAnimationFrame(raf);
    root.classList.remove("intro-on"); el.classList.add("out");
    setTimeout(() => el.remove(), 750);
  };

  addEventListener("keydown", e => { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") finish(); }, { once: true });

  const paths = HAND.map(d => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("class", "ink"); ink.appendChild(p); return p; });

  const place = (x, y, hop = 0) => buddy.setAttribute("transform", `translate(${x.toFixed(2)} ${(y - hop).toFixed(2)})`);

  if (reduced) {
    const end = paths[paths.length - 1].getPointAtLength(lens[lens.length - 1]);
    place(end.x + 6, end.y);

  // timeline: short pause, then draw each stroke with a quick hop between strokes

  const plan = []; let t = START;
  paths.forEach((p, i) => {
    const d = WRITE * lens[i] / total;
    plan.push({ kind: "draw", i, t0: t, t1: t + d }); t += d;
    if (i < paths.length - 1) {
      const a = p.getPointAtLength(lens[i]), b = paths[i + 1].getPointAtLength(0);
      const hop = Math.hypot(b.x - a.x, b.y - a.y) > 8 ? HOP : 0.02;
